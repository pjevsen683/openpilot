<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tavascan shadow</title>
<style>
  /* One iPhone screen, no scrolling. dvh so the Safari toolbars do not cut it off. */
  :root { color-scheme: dark; --gap: 6px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: #111; color: #eee; font: 13px/1.25 -apple-system, system-ui, sans-serif;
         height: 100dvh; display: grid; grid-template-rows: auto 1fr auto auto;
         gap: var(--gap); padding: calc(env(safe-area-inset-top) + 6px) 6px
                                   calc(env(safe-area-inset-bottom) + 6px) 6px; }

  .nums { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: var(--gap); align-items: center; }
  .n { background: #1c1c1c; border-radius: 8px; padding: 4px 8px; }
  .n b { display: block; font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .n s { display: block; text-decoration: none; font-size: 9px; color: #888;
         text-transform: uppercase; letter-spacing: .07em; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #333; }
  .dot.on { background: #3ddc84; }

  .views { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); min-height: 0; }
  .view { position: relative; background: #161616; border-radius: 8px; overflow: hidden; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tag { position: absolute; top: 4px; left: 6px; font-size: 9px; color: #777;
         text-transform: uppercase; letter-spacing: .07em; pointer-events: none; }
  .btns { position: absolute; top: 3px; right: 4px; display: flex; gap: 3px; }
  .btns button { background: #2a2a2ad0; color: #bbb; border: 0; border-radius: 4px;
                 padding: 2px 5px; font-size: 9px; }
  .foot { position: absolute; bottom: 3px; left: 6px; right: 6px; font-size: 9px;
          color: #999; pointer-events: none; }

  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  .chip { background: #1c1c1c; border-radius: 8px; padding: 4px 7px; border-left: 3px solid #333;
          min-width: 0; }
  .chip.on { background: #4a2a12; border-left-color: #ff9c3a; }
  .chip u { display: block; text-decoration: none; font-size: 9px; color: #999;
            text-transform: uppercase; letter-spacing: .06em; }
  .chip i { font-style: normal; font-size: 11px; color: #ddd; display: block;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 10px; color: #777; display: flex; gap: 10px; flex-wrap: wrap;
            justify-content: space-between; }
</style>
</head>
<body>
<div class="nums">
  <div class="n"><s>speed</s><b id="v">–</b></div>
  <div class="n"><s>set</s><b id="vs">–</b></div>
  <div class="n"><s>would be</s><b id="dv">–</b></div>
  <div class="dot" id="eng" title="engaged"></div>
</div>

<div class="views">
  <div class="view">
    <canvas id="bev"></canvas>
    <div class="tag">around us</div>
    <div class="btns">
      <button id="bw">8 m</button><button id="ba">140</button><button id="bm">map</button>
    </div>
    <div class="foot" id="bevfoot"></div>
  </div>
  <div class="view">
    <canvas id="route"></canvas>
    <div class="tag">road ahead 500 m</div>
    <div class="foot" id="routefoot"></div>
  </div>
</div>

<div class="chips">
  <div class="chip" id="c1"><u>undertaking</u><i>–</i></div>
  <div class="chip" id="c2"><u>merge yield</u><i>–</i></div>
  <div class="chip" id="c3"><u>left lane</u><i>–</i></div>
</div>

<div class="status"><span id="s1">connecting…</span><span id="s2"></span></div>
<script>
function draw(cv, d) {
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const EGO_Y = h - Math.min(62, h * 0.18);   // leaves room for our own body below the origin
  const X = y => w / 2 + (y / viewHalf) * (w / 2);
  const Y = x => EGO_Y - (x / viewAhead) * (EGO_Y - 10);

  // distance rings
  ctx.strokeStyle = "#242424"; ctx.fillStyle = "#4a4a4a";
  ctx.font = "10px system-ui"; ctx.lineWidth = 1;
  const step = viewAhead <= 60 ? 10 : 25;
  for (let m = step; m <= viewAhead; m += step) {
    ctx.beginPath(); ctx.moveTo(0, Y(m)); ctx.lineTo(w, Y(m)); ctx.stroke();
    ctx.fillText(m + " m", 4, Y(m) - 3);
  }

  const poly = (pts, style, width, dash) => {
    if (!pts || pts.length < 2) return;
    ctx.save(); ctx.strokeStyle = style; ctx.lineWidth = width;
    ctx.setLineDash(dash || []); ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(X(y), Y(x)) : ctx.moveTo(X(y), Y(x)));
    ctx.stroke(); ctx.restore();
  };

  const sc = d.scene || {};
  // map layer underneath, so the model always reads on top of it
  if (showMap && d.osm && d.osm.road_ahead && d.osm.road_ahead.available)
    poly(d.osm.road_ahead.points, "#2b6cb0", 9, null);

  (sc.road_edges || []).forEach(e => e && poly(e.points, "#6b4a2a", 3));
  (sc.lane_lines || []).forEach(l => {
    if (!l) return;
    poly(l.points, l.confident ? "#d8d8d8" : "#4a4a4a", l.confident ? 2.5 : 1.5,
         l.confident ? [] : [5, 5]);
  });

  // radar objects
  const tgt = [d.undertake, d.merge_yield].filter(r => r.active && r.target)
                                          .map(r => r.target.id);
  (d.points || []).forEach(p => {
    if (p.d > viewAhead || Math.abs(p.y) > viewHalf) return;
    const hit = tgt.includes(p.id);
    const cx = X(p.y), rear = Y(p.d);
    const bw = Math.max(7, (CAR_W / viewHalf) * (w / 2));
    const bh = Math.max(10, Y(0) - Y(CAR_L));
    ctx.fillStyle = hit ? "#ff9c3a" : "#46b3ff";
    // rear edge sits on the reading; the body extends away from us
    ctx.fillRect(cx - bw / 2, rear - bh, bw, bh);
    ctx.fillStyle = "#eee"; ctx.font = "11px system-ui";
    ctx.fillText(`${(p.v_abs * 3.6).toFixed(0)}`, cx + bw / 2 + 3, rear - 2);
  });

  // ego: front bumper on the origin, body drawn backwards
  const ew = Math.max(7, (CAR_W / viewHalf) * (w / 2));
  const eh = Math.max(10, Y(0) - Y(CAR_L));
  ctx.fillStyle = "#3ddc84";
  ctx.fillRect(X(0) - ew / 2, EGO_Y, ew, eh);
}
function drawRoute(cv, psd) {
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const segs = (psd && psd.segments) || [];
  if (!segs.length) {
    ctx.fillStyle = "#666"; ctx.font = "12px system-ui";
    ctx.fillText("no route from the car", 10, 20); return;
  }

  // walk the chain in the car's frame: x forward, y right, heading in radians
  const pts = [{ s: 0, x: 0, y: 0 }];
  const marks = [];
  let x = 0, y = 0, th = 0, travelled = 0;
  for (const sg of segs) {
    const len = Math.max(2, sg.ends_at_m - sg.at_m);
    // blend start and end radius across the segment where both are known
    const r0 = sg.radius_start_m, r1 = sg.radius_m;
    const d0 = sg.bend_dir_start, d1 = sg.bend_dir;
    for (let s = 0; s < len && travelled < ROUTE_M; s += 2) {
      const f = s / len;
      let k = 0;
      if (r0 && r1) k = ((1 - f) * d0 / r0) + (f * d1 / r1);
      else if (r1) k = d1 / r1;
      else if (r0) k = d0 / r0;
      th += k * 2;
      x += Math.cos(th) * 2; y += Math.sin(th) * 2;
      travelled += 2;
      pts.push({ s: travelled, x, y });
    }
    if (travelled >= ROUTE_M) break;
  }
  for (const b of (psd.branches || [])) {
    if (b.at_m > ROUTE_M) continue;
    const at = pts.reduce((a, p) => Math.abs(p.s - b.at_m) < Math.abs(a.s - b.at_m) ? p : a, pts[0]);
    marks.push({ p: at, b });
  }

  // fit
  let minx = 0, maxx = 0, miny = 0, maxy = 0;
  for (const p of pts) { minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x);
                         miny = Math.min(miny, p.y); maxy = Math.max(maxy, p.y); }
  const pad = 28;
  const sc = Math.min((w - 2 * pad) / Math.max(20, maxy - miny),
                      (h - 2 * pad) / Math.max(40, maxx - minx));
  // A road that runs mostly straight would otherwise sit as a ribbon down one
  // edge, so centre whatever lateral extent it has.
  const offx = (w - (maxy - miny) * sc) / 2;
  const PX = p => offx + (p.y - miny) * sc;
  const PY = p => h - pad - (p.x - minx) * sc;

  // distance ticks along the road
  ctx.strokeStyle = "#2a2a2a"; ctx.fillStyle = "#555"; ctx.font = "10px system-ui";
  for (const p of pts) {
    if (p.s % 100 || !p.s) continue;
    ctx.beginPath(); ctx.arc(PX(p), PY(p), 3, 0, 7); ctx.stroke();
    ctx.fillText(p.s + " m", PX(p) + 6, PY(p) + 3);
  }

  // the road
  ctx.strokeStyle = "#d8d8d8"; ctx.lineWidth = 5; ctx.lineJoin = "round";
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(PX(p), PY(p)) : ctx.moveTo(PX(p), PY(p)));
  ctx.stroke();

  // branches as stubs at their own angle
  for (const m of marks) {
    const i = pts.indexOf(m.p);
    const prev = pts[Math.max(0, i - 3)];
    const base = Math.atan2(m.p.y - prev.y, m.p.x - prev.x);
    const sign = m.b.side === "right" ? 1 : -1;
    const a = base + sign * (m.b.angle || 30) * Math.PI / 180;
    const L = 26;
    ctx.strokeStyle = m.b.ramp ? "#ff9c3a" : "#46b3ff";
    ctx.lineWidth = m.b.probable ? 4 : 2;
    ctx.setLineDash(m.b.probable ? [] : [4, 3]);
    ctx.beginPath();
    ctx.moveTo(PX(m.p), PY(m.p));
    ctx.lineTo(PX(m.p) + Math.sin(a) * L, PY(m.p) - Math.cos(a) * L);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // us
  ctx.fillStyle = "#3ddc84";
  ctx.beginPath(); ctx.arc(PX(pts[0]), PY(pts[0]), 6, 0, 7); ctx.fill();

  // the next slowdown, marked on the road
  const ns = psd.next_slowdown;
  if (ns && ns.at_m <= ROUTE_M) {
    const p = pts.reduce((a, q) => Math.abs(q.s - ns.at_m) < Math.abs(a.s - ns.at_m) ? q : a, pts[0]);
    ctx.strokeStyle = "#ff9c3a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(PX(p), PY(p), 9, 0, 7); ctx.stroke();
    ctx.fillStyle = "#ff9c3a"; ctx.font = "600 11px system-ui";
    ctx.fillText(ns.kph + " km/h", PX(p) + 12, PY(p) - 6);
  }
}
// One frame everywhere: x metres ahead, y metres to the RIGHT. The radar's
// opposite sign is flipped on the device, never here.
//
// The origin is our FRONT BUMPER, not the middle of the car, because that is
// what dRel is measured from: opendbc subtracts DREL_FRONT_EDGE_MARGIN (1.5 m)
// on top of the DBC offset to approximate the gap to the rear of the object.
const CAR_L = 4.6;        // metres, drawn to scale
const CAR_W = 1.85;
let viewHalf = 8, viewAhead = 140, showMap = true;
const ROUTE_M = 500;

const kph = v => v === null || v === undefined ? "–" : v.toFixed(0);
const set = (id, html) => { document.getElementById(id).innerHTML = html; };

function chip(id, label, on, text) {
  const el = document.getElementById(id);
  el.className = "chip" + (on ? " on" : "");
  el.innerHTML = `<u>${label}</u><i>${text}</i>`;
}

function render(d) {
  if (!d.ready) { set("s1", "waiting for the car…"); return; }
  const delta = d.delta_kph;
  set("v", kph(d.v_ego_kph));
  set("vs", kph(d.v_cruise_kph));
  document.getElementById("dv").innerHTML = delta === null ? "–" : delta.toFixed(0);
  document.getElementById("dv").style.color = delta === null ? "#666" : "#ff9c3a";
  document.getElementById("eng").className = "dot" + (d.engaged ? " on" : "");

  const short = s => (s || "").replace(/ -- .*/, "").replace(/\(.*\)/, "").trim();
  chip("c1", "undertaking", d.undertake.active,
       d.undertake.active ? `cap ${kph(d.undertake.cap * 3.6)} km/h` : short(d.undertake.why));
  chip("c2", "merge yield", d.merge_yield.active,
       d.merge_yield.active ? `cap ${kph(d.merge_yield.cap * 3.6)} km/h` : short(d.merge_yield.why));
  const L = d.left_lane || {}, seen = L.nearest;
  chip("c3", "left lane", !!L.slower,
       seen ? `${kph(seen.v_abs * 3.6)} km/h · ${seen.d.toFixed(0)} m · ${L.diff_kph > 0 ? "+" : ""}${L.diff_kph}`
            : "nothing in range");

  // context under each view
  const lanes = d.lanes || {};
  set("bevfoot", `${(d.points || []).length} objects · `
      + `${lanes.rightmost ? "rightmost" : lanes.leftmost ? "leftmost" : "middle"} · `
      + `edges ${lanes.left_edge_m ?? "?"}/${lanes.right_edge_m ?? "?"} m`);

  const p = d.psd || {}, ns = p.next_slowdown, here = p.here;
  set("routefoot", ns
      ? `<span style="color:#ff9c3a">${ns.kind}${ns.side ? " " + ns.side : ""} in ${ns.at_m} m → ${ns.kph} km/h</span>`
      : (here ? `${here.category} · ${here.lanes} lane(s)` : "no route"));

  const osm = d.osm || {}, live = osm.live || {};
  set("s1", `${live.road_name || "–"}${live.speed_limit_kph ? " · " + live.speed_limit_kph + " km/h" : ""}`
      + `${here && here.remaining_m != null ? " · " + here.remaining_m + " m to segment end" : ""}`);
  set("s2", `radar ${d.radar_age_s ?? "?"}s · psd ${p.age_s ?? "?"}s`
      + ` · guidance ${p.guidance === null || p.guidance === undefined ? "?" : p.guidance ? "on" : "off"}`
      + " · shadow only");

  draw(document.getElementById("bev"), d);
  drawRoute(document.getElementById("route"), p);
}

document.getElementById("bw").onclick = e => {
  viewHalf = viewHalf === 4 ? 8 : viewHalf === 8 ? 16 : 4;
  e.target.textContent = viewHalf + " m";
};
document.getElementById("ba").onclick = e => {
  viewAhead = viewAhead === 60 ? 140 : 60;
  e.target.textContent = viewAhead;
};
document.getElementById("bm").onclick = e => {
  showMap = !showMap;
  e.target.style.color = showMap ? "#bbb" : "#555";
};

async function tick() {
  try { render(await (await fetch("/data.json", {cache: "no-store"})).json()); }
  catch (e) { /* device dropped off wifi; keep the last frame on screen */ }
}
setInterval(tick, 400); tick();
</script>
</body>
</html>
