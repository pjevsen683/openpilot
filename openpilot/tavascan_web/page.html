<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tavascan shadow</title>
<style>
  /* One iPhone screen, no scrolling. dvh so the Safari toolbars do not cut it off. */
  :root { color-scheme: dark; --gap: 6px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: #111; color: #eee; font: 13px/1.25 -apple-system, system-ui, sans-serif;
         height: 100dvh; display: grid; grid-template-rows: auto 1fr auto auto auto;
         gap: var(--gap); padding: calc(env(safe-area-inset-top) + 6px) 6px
                                   calc(env(safe-area-inset-bottom) + 6px) 6px; }

  .nums { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: var(--gap); align-items: center; }
  .n { background: #1c1c1c; border-radius: 8px; padding: 4px 8px; }
  .n b { display: block; font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .n s { display: block; text-decoration: none; font-size: 9px; color: #888;
         text-transform: uppercase; letter-spacing: .07em; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #333; }
  .dot.on { background: #3ddc84; }

  .views { display: grid; grid-template-columns: 1fr; gap: var(--gap); min-height: 0; }
  .view { position: relative; background: #161616; border-radius: 8px; overflow: hidden; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tag { position: absolute; top: 4px; left: 6px; font-size: 9px; color: #777;
         text-transform: uppercase; letter-spacing: .07em; pointer-events: none; }
  .btns { position: absolute; top: 3px; right: 4px; display: flex; gap: 3px; }
  .btns button { background: #2a2a2ad0; color: #bbb; border: 0; border-radius: 4px;
                 padding: 2px 5px; font-size: 9px; }
  .foot { position: absolute; top: 18px; left: 6px; right: 6px; font-size: 9px;
          color: #999; pointer-events: none; }

  .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap); }
  .chip { background: #1c1c1c; border-radius: 8px; padding: 4px 7px; border-left: 3px solid #333;
          min-width: 0; }
  .chip.on { background: #4a2a12; border-left-color: #ff9c3a; }
  .chip u { display: block; text-decoration: none; font-size: 9px; color: #999;
            text-transform: uppercase; letter-spacing: .06em; }
  .chip i { font-style: normal; font-size: 11px; color: #ddd; display: block;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .raw { font: 9px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; color: #555;
         background: #161616; border-radius: 6px; padding: 4px 6px; overflow: hidden; }
  .raw b { color: #999; font-weight: 400; }        /* byte der har bevaeget sig */
  .raw u { color: #666; text-decoration: none; }   /* beskedens navn */
  .status { font-size: 10px; color: #777; display: flex; gap: 10px; flex-wrap: wrap;
            justify-content: space-between; }
</style>
</head>
<body>
<div class="nums">
  <div class="n"><s>speed</s><b id="v">–</b></div>
  <div class="n"><s>set</s><b id="vs">–</b></div>
  <div class="n"><s>would be</s><b id="dv">–</b></div>
  <div class="dot" id="eng" title="engaged"></div>
</div>

<div class="views">
  <div class="view">
    <canvas id="bev"></canvas>
    <div class="tag">around us · road to 500 m</div>
    <div class="btns">
      <button id="bw">8 m</button><button id="ba">140</button><button id="bm">map</button>
    </div>
    <div class="foot" id="bevfoot"></div>
  </div>
</div>

<div class="chips">
  <div class="chip" id="c1"><u>undertaking</u><i>–</i></div>
  <div class="chip" id="c3"><u>left lane</u><i>–</i></div>
</div>

<div class="raw" id="raw"></div>
<div class="status"><span id="s1">connecting…</span><span id="s2"></span></div>
<script>
function draw(cv, d) {
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // Distance up the screen: linear out to `near`, where radar and model live,
  // then squeezed so the car's own route still fits up to ROUTE_M. The scale
  // falls off as g = 1 / sqrt(1 + c u^2 / (u + 150)), u metres past `near`: flat
  // where it starts, so lines bend there rather than kink, and like 1/sqrt(c u)
  // further out, which spreads 200-500 m more evenly than a log does. Sideways
  // shrinks by the same g, so far road narrows like perspective instead of
  // running off the side.
  const near = viewAhead;
  const REAR_PX = 30;                                // strip for the side radar
  const EGO_Y = h - REAR_PX - 14;
  const TOP = 58;                                    // below the text overlay
  const FAR_PX = Math.round((EGO_Y - TOP) * 0.42);
  const s = (EGO_Y - TOP - FAR_PX) / near;           // px per metre, near part
  const span = ROUTE_M - near;
  const gOf = (c, u) => 1 / Math.sqrt(1 + c * u * u / (u + 150));
  const farPx = c => { let t = 0; for (let u = 0.5; u < span; u += 1) t += gOf(c, u); return s * t; };
  let c = 0;
  if (s * span > FAR_PX) {
    let lo = 0, hi = 5000;
    for (let i = 0; i < 40; i++) { c = (lo + hi) / 2; (farPx(c) > FAR_PX) ? (lo = c) : (hi = c); }
  }
  const tab = [0];                                   // px above the ego line, per metre past near
  for (let u = 0; u < span + 2; u++) tab.push(tab[u] + s * gOf(c, u + 0.5));
  const up = x => {
    if (x <= near) return x * s;
    const u = Math.min(x - near, span + 1), i = Math.floor(u);
    return near * s + tab[i] + (tab[i + 1] - tab[i]) * (u - i);
  };
  const k = x => x <= near ? 1 : gOf(c, x - near);
  const sx = (w / 2) / viewHalf;
  const X = (y, x) => w / 2 + y * sx * k(x);
  const Y = x => EGO_Y - up(Math.max(x, 0));

  // distance rings
  ctx.strokeStyle = "#242424"; ctx.fillStyle = "#4a4a4a";
  ctx.font = "10px system-ui"; ctx.lineWidth = 1;
  const step = near <= 60 ? 10 : 25;
  const rings = [];
  for (let m = step; m <= near; m += step) rings.push(m);
  for (const m of [200, 300, 400, 500]) if (m > near + 30) rings.push(m);
  for (const m of rings) {
    ctx.beginPath(); ctx.moveTo(0, Y(m)); ctx.lineTo(w, Y(m)); ctx.stroke();
    ctx.fillText(m + " m", 4, Y(m) - 3);
  }
  ctx.strokeStyle = "#333"; ctx.setLineDash([2, 4]);
  ctx.beginPath(); ctx.moveTo(0, Y(near)); ctx.lineTo(w, Y(near)); ctx.stroke();
  ctx.setLineDash([]);

  const poly = (pts, style, width, dash) => {
    if (!pts || pts.length < 2) return;
    ctx.save(); ctx.strokeStyle = style; ctx.lineWidth = width; ctx.lineJoin = "round";
    ctx.setLineDash(dash || []); ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(X(y, x), Y(x)) : ctx.moveTo(X(y, x), Y(x)));
    ctx.stroke(); ctx.restore();
  };

  // The car's own route (PSD), drawn underneath and faint: out here it is the
  // only source, close in the model is better and is drawn on top of it.
  const route = psdRoute(d.psd, d.lanes);
  for (const ln of route.lines) poly(ln.pts, ln.edge ? "#4f4f4f" : "#333", ln.edge ? 2 : 1, ln.edge ? null : [5, 5]);
  for (const m of route.marks) {
    const L = Math.max(10, 22 * k(m.x));
    ctx.save();
    ctx.strokeStyle = m.ramp ? "#ff9c3a" : "#46b3ff";
    ctx.lineWidth = m.probable ? 4 : 2; ctx.setLineDash(m.probable ? [] : [4, 3]);
    ctx.beginPath(); ctx.moveTo(X(m.y, m.x), Y(m.x));
    ctx.lineTo(X(m.y, m.x) + Math.sin(m.a) * L, Y(m.x) - Math.cos(m.a) * L);
    ctx.stroke(); ctx.restore();
  }

  const sc = d.scene || {};
  if (showMap && d.osm && d.osm.road_ahead && d.osm.road_ahead.available)
    poly(d.osm.road_ahead.points, "#2b6cb080", 7, null);

  (sc.road_edges || []).forEach(e => e && poly(e.points, "#6b4a2a", 3));
  (sc.lane_lines || []).forEach(l => {
    if (!l) return;
    poly(l.points, l.confident ? "#d8d8d8" : "#4a4a4a", l.confident ? 2.5 : 1.5,
         l.confident ? [] : [5, 5]);
  });

  // radar objects
  const tgt = [d.undertake].filter(r => r.active && r.target).map(r => r.target.id);
  (d.points || []).forEach(p => {
    if (Math.abs(p.y) > viewHalf * 1.2) return;
    const hit = tgt.includes(p.id);
    const cx = X(p.y, p.d), rear = Y(p.d);
    const bw = Math.max(5, CAR_W * sx * k(p.d));
    const bh = Math.max(6, rear - Y(p.d + CAR_L));
    ctx.fillStyle = hit ? "#ff9c3a" : "#46b3ff";
    // rear edge sits on the reading; the body extends away from us
    ctx.fillRect(cx - bw / 2, rear - bh, bw, bh);
    ctx.fillStyle = "#eee"; ctx.font = "11px system-ui";
    ctx.fillText(`${(p.v_abs * 3.6).toFixed(0)}`, cx + bw / 2 + 3, rear - 2);
  });

  const ew = Math.max(7, CAR_W * sx);
  const eh = Math.max(10, CAR_L * s);

  // Blind spot: the car reports presence per side and nothing else, so the
  // car is drawn level with us, one lane over, dashed because the position is
  // assumed rather than measured.
  const bs = d.blindspot || {};
  for (const [side, on] of [["left", bs.left], ["right", bs.right]]) {
    if (!on) continue;
    const y = side === "left" ? -LANE_W : LANE_W;
    ctx.save();
    ctx.strokeStyle = "#c77dff"; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
    ctx.strokeRect(X(y, 0) - ew / 2, EGO_Y - eh * 0.15, ew, eh);
    ctx.restore();
  }

  // ego: front bumper on the origin, body drawn backwards
  ctx.fillStyle = "#3ddc84";
  ctx.fillRect(X(0, 0) - ew / 2, EGO_Y, ew, eh);

  // Side radar, behind us. Closing speed is all it gives: no distance, no side,
  // so the objects sit in a row under us rather than anywhere on the road.
  const rear = (d.rear || []).slice().sort((p, q) => q.closing_kph - p.closing_kph);
  const ry = h - REAR_PX / 2 + 4;
  ctx.font = "9px system-ui"; ctx.fillStyle = "#555";
  ctx.fillText(rear.length ? "behind" : "behind: nothing", 4, ry);
  const cell = 52, x0 = w / 2 - (rear.length - 1) * cell / 2;
  rear.forEach((o, i) => {
    const cx = x0 + i * cell, c = o.closing_kph;
    const col = c >= 20 ? "#ff9c3a" : c > 3 ? "#c77dff" : "#666";
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(cx - 13, ry - 5); ctx.lineTo(cx - 6, ry - 13); ctx.lineTo(cx + 1, ry - 5); ctx.fill();
    ctx.fillStyle = "#ddd"; ctx.font = "11px system-ui";
    ctx.fillText(`${c > 0 ? "+" : ""}${c.toFixed(0)}`, cx + 4, ry - 3);
  });
}

// The car's PSD route as polylines in the car frame, shifted so that the lane
// we are in sits under us. PSD_Pos_Fahrspur is not populated by the car, so the
// lane comes from the model: rightmost and leftmost are read off laneLineProbs,
// anything else we do not know and the road is centred on us.
function psdRoute(psd, lanePos) {
  const out = { lines: [], marks: [] };
  const segs = (psd && psd.segments) || [];
  if (!segs.length) return out;

  const pts = [{ s: 0, x: 0, y: 0, th: 0, lanes: (segs[0] && segs[0].lanes) || 1 }];
  let x = 0, y = 0, th = 0, travelled = 0;
  for (const sg of segs) {
    const len = Math.max(2, sg.ends_at_m - sg.at_m);
    // blend start and end radius across the segment where both are known
    const r0 = sg.radius_start_m, r1 = sg.radius_m;
    const d0 = sg.bend_dir_start, d1 = sg.bend_dir;
    for (let s = 0; s < len && travelled < ROUTE_M; s += 2) {
      const f = s / len;
      let k = 0;
      if (r0 && r1) k = ((1 - f) * d0 / r0) + (f * d1 / r1);
      else if (r1) k = d1 / r1;
      else if (r0) k = d0 / r0;
      th += k * 2;
      x += Math.cos(th) * 2; y += Math.sin(th) * 2;
      travelled += 2;
      pts.push({ s: travelled, x, y, th, lanes: sg.lanes || 1 });
    }
    if (travelled >= ROUTE_M) break;
  }

  const L0 = pts[0].lanes || 1;
  let idx = (L0 - 1) / 2;
  if (lanePos && L0 > 1) {
    if (lanePos.rightmost) idx = L0 - 1;
    else if (lanePos.leftmost) idx = 0;
  }
  const shift = (idx + 0.5 - L0 / 2) * LANE_W;

  // x is forward and y is right, so the normal pointing right is
  // (-sin th, cos th) and an offset of o metres lands at (x - sin(th) o, y + cos(th) o).
  const off = (p, o) => [p.x - Math.sin(p.th) * o, p.y + Math.cos(p.th) * o - shift];
  const maxLanes = Math.max(1, ...pts.map(p => p.lanes || 1));
  for (let i = 0; i <= maxLanes; i++) {
    let cur = [];
    const flush = () => { if (cur.length > 1) out.lines.push({ pts: cur, edge: i === 0 || i === maxLanes }); cur = []; };
    for (const p of pts) {
      const L = p.lanes || 1;
      if (i > L) { flush(); continue; }   // lane does not exist here
      cur.push(off(p, (i - L / 2) * LANE_W));
    }
    flush();
  }

  // branches as stubs at their own angle, from the edge on their side
  for (const b of (psd.branches || [])) {
    if (b.at_m > ROUTE_M) continue;
    const i = pts.reduce((bi, p, j) => Math.abs(p.s - b.at_m) < Math.abs(pts[bi].s - b.at_m) ? j : bi, 0);
    const p = pts[i], prev = pts[Math.max(0, i - 3)];
    const sign = b.side === "right" ? 1 : -1;
    const [bx, by] = off(p, sign * (p.lanes || 1) * LANE_W / 2);
    const heading = Math.atan2(p.y - prev.y, p.x - prev.x);
    // screen angle: 0 = straight up the screen, positive = to the right
    out.marks.push({ x: bx, y: by, a: heading + sign * (b.angle || 30) * Math.PI / 180,
                     ramp: b.ramp, probable: b.probable });
  }
  return out;
}

// One frame everywhere: x metres ahead, y metres to the RIGHT. The radar's
// opposite sign is flipped on the device, never here.
//
// The origin is our FRONT BUMPER, not the middle of the car, because that is
// what dRel is measured from: opendbc subtracts DREL_FRONT_EDGE_MARGIN (1.5 m)
// on top of the DBC offset to approximate the gap to the rear of the object.
const CAR_L = 4.6;        // metres, drawn to scale
const CAR_W = 1.85;
let viewHalf = 8, viewAhead = 140, showMap = true;
const ROUTE_M = 500;
const LANE_W = 3.5;   // metres, for drawing only

const kph = v => v === null || v === undefined ? "–" : v.toFixed(0);
const set = (id, html) => { document.getElementById(id).innerHTML = html; };

function chip(id, label, on, text) {
  const el = document.getElementById(id);
  el.className = "chip" + (on ? " on" : "");
  el.innerHTML = `<u>${label}</u><i>${text}</i>`;
}

function render(d) {
  if (!d.ready) { set("s1", "waiting for the car…"); return; }
  const delta = d.delta_kph;
  set("v", kph(d.v_ego_kph));
  set("vs", kph(d.v_cruise_kph));
  document.getElementById("dv").innerHTML = delta === null ? "–" : delta.toFixed(0);
  document.getElementById("dv").style.color = delta === null ? "#666" : "#ff9c3a";
  document.getElementById("eng").className = "dot" + (d.engaged ? " on" : "");

  const short = s => (s || "").replace(/ -- .*/, "").replace(/\(.*\)/, "").trim();
  chip("c1", "undertaking", d.undertake.active,
       d.undertake.active ? `cap ${kph(d.undertake.cap * 3.6)} km/h` : short(d.undertake.why));
  const L = d.left_lane || {}, seen = L.nearest;
  chip("c3", "left lane", !!L.slower,
       seen ? `${kph(seen.v_abs * 3.6)} km/h · ${seen.d.toFixed(0)} m · ${L.diff_kph > 0 ? "+" : ""}${L.diff_kph}`
            : "nothing in range");

  // context for the view, radar and model first, then what PSD says -- not
  // what we would infer from it. Curvature does not describe tight corners, so
  // no speed is derived from the road ahead.
  const lanes = d.lanes || {}, bs2 = d.blindspot || {};
  const bsTxt = [bs2.left ? "L" : null, bs2.right ? "R" : null].filter(Boolean).join("+");
  const p = d.psd || {}, here = p.here;
  const nextBranch = (p.branches || [])[0];
  set("bevfoot", `${(d.points || []).length} objects${bsTxt ? " · blind spot " + bsTxt : ""} · `
      + `${lanes.rightmost ? "rightmost" : lanes.leftmost ? "leftmost" : "middle"} · `
      + `edges ${lanes.left_edge_m ?? "?"}/${lanes.right_edge_m ?? "?"} m<br>`
      + (here ? `${here.category} · ${here.lanes} lane(s)`
                + (nextBranch ? ` · ${nextBranch.ramp ? "ramp" : "turning"} ${nextBranch.side} in ${nextBranch.at_m} m` : "")
              : "no route from the car"));

  const osm = d.osm || {}, live = osm.live || {};
  set("s1", `${live.road_name || "–"}${live.speed_limit_kph ? " · " + live.speed_limit_kph + " km/h" : ""}`
      + `${here && here.remaining_m != null ? " · " + here.remaining_m + " m to segment end" : ""}`);
  set("s2", `radar ${d.radar_age_s ?? "?"}s · psd ${p.age_s ?? "?"}s`
      + ` · guidance ${p.guidance === null || p.guidance === undefined ? "?" : p.guidance ? "on" : "off"}`
      + " · shadow only");

  // raw side-assist frames, only partly decoded (closing speed, drawn behind
  // us). Bytes that have been seen to change are
  // brighter; the rest have held one value the whole session.
  const sr = d.side_raw || {}, sl = d.side_live || {};
  document.getElementById("raw").innerHTML = ["0x24C", "0x24D"].map(k => {
    const hex = sr[k];
    if (!hex) return `<u>${k}</u> –`;
    const live = sl[k] || [];
    const bytes = hex.match(/../g).map((h, i) =>
      live[i] ? `<b>${h}</b>` : h).join(" ");
    return `<u>${k}</u> ${bytes}`;
  }).join("<br>");

  draw(document.getElementById("bev"), d);
}

document.getElementById("bw").onclick = e => {
  viewHalf = viewHalf === 4 ? 8 : viewHalf === 8 ? 16 : 4;
  e.target.textContent = viewHalf + " m";
};
document.getElementById("ba").onclick = e => {
  viewAhead = viewAhead === 60 ? 140 : 60;
  e.target.textContent = viewAhead;
};
document.getElementById("bm").onclick = e => {
  showMap = !showMap;
  e.target.style.color = showMap ? "#bbb" : "#555";
};

async function tick() {
  try { render(await (await fetch("/data.json", {cache: "no-store"})).json()); }
  catch (e) { /* device dropped off wifi; keep the last frame on screen */ }
}
setInterval(tick, 400); tick();
</script>
</body>
</html>
