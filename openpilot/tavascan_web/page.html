<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tavascan shadow</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 10px; background: #111; color: #eee;
         font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  h2 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase;
       letter-spacing: .08em; color: #888; font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .card { flex: 1; background: #1c1c1c; border-radius: 10px; padding: 9px 11px; }
  .big { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .lbl { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .06em; }
  .verdict { border-radius: 10px; padding: 10px 12px; margin-top: 6px; background: #1c1c1c;
             border-left: 4px solid #333; }
  .on { background: #4a2a12; border-left-color: #ff9c3a; }
  .why { color: #bbb; font-size: 13px; margin-top: 3px; }
  canvas { width: 100%; display: block; background: #161616; border-radius: 10px; }
  button.zb { background:#262626; color:#ccc; border:0; border-radius:5px;
              padding:2px 7px; margin-left:3px; font-size:11px; }
  .legend { font-size: 11px; color: #777; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: 1px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 11px; color: #888; font-weight: 600; padding: 3px 0; }
  td { padding: 3px 0; border-top: 1px solid #262626; }
  .none { color: #666; font-style: italic; }
  label.tog { font-size: 12px; color: #aaa; margin-left: 10px; }
</style>
</head>
<body>
<div id="app"><p class="none">connecting…</p></div>
<script>
// ---- drawing -------------------------------------------------------------
// One frame everywhere: x metres ahead, y metres to the RIGHT. The radar's
// opposite sign is flipped on the device, never here.
//
// The origin is our FRONT BUMPER, not the middle of the car, because that is
// what dRel is measured from: opendbc subtracts DREL_FRONT_EDGE_MARGIN (1.5 m)
// on top of the DBC offset to approximate the gap to the rear of the object.
// So our body is drawn backwards from the origin and every other car is drawn
// forwards from its own reading, leaving exactly dRel of empty road between
// them. Drawing either one centred, as this did at first, made a car at 0 m
// sit on top of our icon.
const CAR_L = 4.6;        // metres, drawn to scale
const CAR_W = 1.85;
// A lane is ~3.7 m wide. At +/-18 m the ego lane lines landed 20 px from centre
// while the car icon itself is 18 px wide, so the road collapsed onto the car and
// read as decoration. +/-8 m puts them at 45 px, which reads as a lane.
let viewHalf  = 8;        // metres drawn either side
let viewAhead = 140;      // metres drawn up the screen
let showMap = true;

function draw(cv, d) {
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = Math.round(w * 1.25);
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  cv.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const EGO_Y = h - 62;   // leaves room for our own body below the origin
  const X = y => w / 2 + (y / viewHalf) * (w / 2);
  const Y = x => EGO_Y - (x / viewAhead) * (EGO_Y - 10);

  // distance rings
  ctx.strokeStyle = "#242424"; ctx.fillStyle = "#4a4a4a";
  ctx.font = "10px system-ui"; ctx.lineWidth = 1;
  const step = viewAhead <= 60 ? 10 : 25;
  for (let m = step; m <= viewAhead; m += step) {
    ctx.beginPath(); ctx.moveTo(0, Y(m)); ctx.lineTo(w, Y(m)); ctx.stroke();
    ctx.fillText(m + " m", 4, Y(m) - 3);
  }

  const poly = (pts, style, width, dash) => {
    if (!pts || pts.length < 2) return;
    ctx.save(); ctx.strokeStyle = style; ctx.lineWidth = width;
    ctx.setLineDash(dash || []); ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(X(y), Y(x)) : ctx.moveTo(X(y), Y(x)));
    ctx.stroke(); ctx.restore();
  };

  const sc = d.scene || {};
  // map layer underneath, so the model always reads on top of it
  if (showMap && d.osm && d.osm.road_ahead && d.osm.road_ahead.available)
    poly(d.osm.road_ahead.points, "#2b6cb0", 9, null);

  (sc.road_edges || []).forEach(e => e && poly(e.points, "#6b4a2a", 3));
  (sc.lane_lines || []).forEach(l => {
    if (!l) return;
    poly(l.points, l.confident ? "#d8d8d8" : "#4a4a4a", l.confident ? 2.5 : 1.5,
         l.confident ? [] : [5, 5]);
  });

  // radar objects
  const tgt = [d.undertake, d.merge_yield].filter(r => r.active && r.target)
                                          .map(r => r.target.id);
  (d.points || []).forEach(p => {
    if (p.d > viewAhead || Math.abs(p.y) > viewHalf) return;
    const hit = tgt.includes(p.id);
    const cx = X(p.y), rear = Y(p.d);
    const bw = Math.max(7, (CAR_W / viewHalf) * (w / 2));
    const bh = Math.max(10, Y(0) - Y(CAR_L));
    ctx.fillStyle = hit ? "#ff9c3a" : "#46b3ff";
    // rear edge sits on the reading; the body extends away from us
    ctx.fillRect(cx - bw / 2, rear - bh, bw, bh);
    ctx.fillStyle = "#eee"; ctx.font = "11px system-ui";
    ctx.fillText(`${(p.v_abs * 3.6).toFixed(0)}`, cx + bw / 2 + 3, rear - 2);
  });

  // ego: front bumper on the origin, body drawn backwards
  const ew = Math.max(7, (CAR_W / viewHalf) * (w / 2));
  const eh = Math.max(10, Y(0) - Y(CAR_L));
  ctx.fillStyle = "#3ddc84";
  ctx.fillRect(X(0) - ew / 2, EGO_Y, ew, eh);
}

// ---- panels --------------------------------------------------------------
const kph = v => v === null || v === undefined ? "–" : v.toFixed(0);

function verdict(name, r) {
  const cap = r.active ? ` &rarr; cap ${kph(r.cap * 3.6)} km/h` : "";
  return `<div class="verdict ${r.active ? "on" : ""}"><b>${name}</b>${cap}
            <div class="why">${r.why}</div></div>`;
}

function osmPanel(o) {
  if (!o) return '<p class="none">no map layer</p>';
  const L = o.live || {}, maps = o.maps || {}, ra = o.road_ahead || {};
  const head = `<div class="card">
      <div>limit <b>${L.speed_limit_kph ?? "–"}</b> km/h
        &nbsp; ahead <b>${L.ahead_kph ?? "–"}</b> km/h
        ${L.ahead_distance_m != null ? `in ${L.ahead_distance_m.toFixed(0)} m` : ""}</div>
      <div class="why">${L.road_name ?? "no road name"} &middot;
        offline maps: ${maps.present ? maps.files + " files" : "NONE DOWNLOADED"} &middot;
        road geometry: ${ra.available ? ra.points.length + " points" : "none"}</div></div>`;
  const keys = Object.keys(o.params || {}).sort();
  if (!keys.length) return head + '<p class="none">mapd publishes no params right now</p>';
  const rows = keys.map(k => {
    let v = o.params[k];
    if (v && v._list) v = `${v.count} points`;
    else if (v && v._truncated) v = `${v.bytes} bytes`;
    else v = JSON.stringify(v);
    if (v.length > 80) v = v.slice(0, 80) + "…";
    return `<tr><td>${k}</td><td>${v}</td></tr>`;
  }).join("");
  return head + `<table><tr><th>param</th><th>value</th></tr>${rows}</table>`;
}

function psdPanel(p) {
  if (!p) return '<p class="none">no PSD</p>';
  if (p.age_s === null || p.age_s === undefined)
    return '<p class="none">the car is not broadcasting PSD</p>';
  const here = p.here;
  const head = `<div class="card">
      <div>${here ? `${here.category}, <b>${here.lanes}</b> lane(s)` : "position segment unknown"}
        &nbsp;&middot;&nbsp; guidance <b>${p.guidance === null ? "?" : p.guidance ? "on" : "off"}</b>
        &nbsp;&middot;&nbsp; ${p.segments_known} segments known</div>
      <div class="why">lane counts unverified &middot; PSD ${p.age_s}s old
        &middot; own lane reads ${p.pos_lane_raw} (not populated by the car)</div></div>`;
  const br = (p.branches || []);
  if (!br.length) return head + '<p class="none">nothing branches off the road ahead</p>';
  const rows = br.slice(0, 8).map(b => `<tr>
      <td>${b.at_m} m</td>
      <td class="${b.side === "right" ? "lane-right" : "lane-left"}">${b.side}</td>
      <td>${b.angle}&deg;</td>
      <td>${b.ramp ? "<b>ramp</b>" : b.category}</td>
      <td>${b.lanes}</td></tr>`).join("");
  return head + `<table><tr><th>ahead</th><th>side</th><th>angle</th>
      <th>type</th><th>lanes</th></tr>${rows}</table>`;
}

function render(d) {
  const app = document.getElementById("app");
  if (!d.ready) { app.innerHTML = '<p class="none">waiting for the car…</p>'; return; }
  const delta = d.delta_kph;

  if (!document.getElementById("bev")) {
    app.innerHTML = `
      <div class="row" id="nums"></div>
      <div id="leftlane"></div>
      <h2>bird's eye
        <label class="tog"><input type="checkbox" id="mapchk" checked> map</label>
        <span class="tog">width <button class="zb" data-w="4">4</button><button class="zb" data-w="8">8</button><button class="zb" data-w="16">16</button> m</span>
        <span class="tog">ahead <button class="zb" data-a="60">60</button><button class="zb" data-a="140">140</button> m</span>
      </h2>
      <canvas id="bev"></canvas>
      <div class="legend" id="diag"></div>
      <div class="legend">
        <span><i class="sw" style="background:#3ddc84"></i> us</span>
        <span><i class="sw" style="background:#46b3ff"></i> radar object</span>
        <span><i class="sw" style="background:#ff9c3a"></i> rule target</span>
        <span><i class="sw" style="background:#d8d8d8"></i> lane line</span>
        <span><i class="sw" style="background:#6b4a2a"></i> road edge</span>
        <span><i class="sw" style="background:#2b6cb0"></i> map road</span>
      </div>
      <h2>rules (shadow only &mdash; nothing is applied)</h2><div id="rules"></div>
      <h2>road ahead (PSD &mdash; the car's own navigation)</h2><div id="psd"></div>
      <h2>map layer</h2><div id="osm"></div>
      <h2>lane</h2><div id="lane"></div>`;
    document.getElementById("mapchk").onchange = e => { showMap = e.target.checked; };
    document.querySelectorAll(".zb").forEach(b => b.onclick = () => {
      if (b.dataset.w) viewHalf = +b.dataset.w;
      if (b.dataset.a) viewAhead = +b.dataset.a;
    });
  }

  document.getElementById("nums").innerHTML = `
    <div class="card"><div class="lbl">speed</div><div class="big">${kph(d.v_ego_kph)}</div></div>
    <div class="card"><div class="lbl">set</div><div class="big">${kph(d.v_cruise_kph)}</div></div>
    <div class="card"><div class="lbl">would be</div>
      <div class="big" style="color:${delta === null ? "#666" : "#ff9c3a"}">
        ${delta === null ? "no change" : delta.toFixed(0) + " km/h"}</div></div>`;

  const L2 = d.left_lane || {};
  const seen = L2.nearest;
  document.getElementById("leftlane").innerHTML = `<div class="verdict ${L2.slower ? "on" : ""}">
      <b>left lane</b> &mdash; ${seen
        ? `${(seen.v_abs * 3.6).toFixed(0)} km/h at ${seen.d.toFixed(0)} m,
           ${seen.y.toFixed(1)} m across
           &nbsp;<b>${L2.diff_kph > 0 ? "+" : ""}${L2.diff_kph} km/h</b> vs us`
        : "nothing in range"}
      <div class="why">${L2.count} object(s) in the left lane &middot;
        ${L2.slower ? "slower than us" : seen ? "not slower, so no reason to hold back" : "the rule has nothing to act on"}</div></div>`;
  document.getElementById("rules").innerHTML =
    verdict("Undertaking guard", d.undertake) + verdict("Merge yield", d.merge_yield);
  document.getElementById("psd").innerHTML = psdPanel(d.psd);
  document.getElementById("osm").innerHTML = osmPanel(d.osm);
  const L = d.lanes;
  document.getElementById("lane").innerHTML = `<div class="card">
      rightmost: <b>${L.rightmost ?? "?"}</b> &nbsp; leftmost: <b>${L.leftmost ?? "?"}</b>
      <div class="why">road edge left ${L.left_edge_m ?? "?"} m, right ${L.right_edge_m ?? "?"} m
        &middot; radar ${d.radar_age_s ?? "?"} s old &middot; engaged ${d.engaged}</div></div>`;

  const sc = d.scene || {};
  const lls = (sc.lane_lines || []).map(l => l ? `${l.prob}${l.confident ? "" : "?"}` : "–").join(" ");
  document.getElementById("diag").innerHTML =
    `lane lines: ${lls || "none received"} &middot; edges: ${(sc.road_edges || []).filter(Boolean).length}` +
    ` &middot; radar objects: ${(d.points || []).length}`;

  draw(document.getElementById("bev"), d);
}

async function tick() {
  try { render(await (await fetch("/data.json", {cache: "no-store"})).json()); }
  catch (e) { /* device dropped off wifi; keep the last frame on screen */ }
}
setInterval(tick, 400); tick();
</script>
</body>
</html>
